name: Deploy Student Edition

on:
  push:
    branches: [main]
    paths: [Student_Edition.zip, Arduino_Student_Offline.zip, student-links.js, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: student-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract the student site
        run: |
          unzip -tq Student_Edition.zip
          unzip -tq Arduino_Student_Offline.zip
          unzip -q Student_Edition.zip -d site
          test -f site/index.html
          test ! -e site/presenter.html
          test "$(find site/sketches -maxdepth 1 -name '*.ino' | wc -l)" -eq 11
          cp Arduino_Student_Offline.zip site/Arduino_Student_Offline.zip
          if test -f student-links.js; then cp student-links.js site/src/student-links.js; fi
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
